# Cloudflare Pages project for www.treasureislanddxb.com.
# The static site lives in public/, server code in functions/ (with shared
# modules in src/), and the database schema in migrations/.
name = "treasure-island"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "treasure-island-db"
# Production database (treasure-island-db).
database_id = "6a364307-b48f-4c77-9b11-4d7137212a79"
migrations_dir = "migrations"

[vars]
SITE_URL = "https://www.treasureislanddxb.com"
