# Cloudflare Pages project for treasureislanddxb.com.
# The static site lives in public/, server code in functions/ (with shared
# modules in src/), and the database schema in migrations/.
name = "treasure-island"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "treasure-island-db"
# Replaced with the real database id when the D1 database is created.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
SITE_URL = "https://treasureislanddxb.com"
